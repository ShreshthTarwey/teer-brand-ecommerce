name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:

      # Step 1 - Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 - Login DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 - Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/teer-brand-backend:latest \
          ./server

      # Step 4 - Push Docker Image
      - name: Push Docker Image
        run: |
          docker push \
          ${{ secrets.DOCKER_USERNAME }}/teer-brand-backend:latest

      # Step 5 - Trigger Jenkins Deployment
      - name: Trigger Jenkins Pipeline
        run: |
          curl -X POST -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_USER_TOKEN }}" \
          "http://${{ secrets.JENKINS_IP }}:8080/job/${{ secrets.JENKINS_JOB }}/build?token=${{ secrets.JENKINS_TOKEN }}"